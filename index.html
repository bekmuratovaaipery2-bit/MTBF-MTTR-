<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ишенимдүүлүк калькулятору</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1c1f26;
    --muted: #5d6573;
    --border: #d9dde5;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --error: #b42318;
    --ok-bg: #eef6ff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --surface: #1e2129;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --border: #333844;
      --accent: #5b8def;
      --accent-text: #0b0d12;
      --error: #ff8a80;
      --ok-bg: #1b2a40;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --surface: #1e2129;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --border: #333844;
    --accent: #5b8def;
    --accent-text: #0b0d12;
    --error: #ff8a80;
    --ok-bg: #1b2a40;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .field { margin-bottom: 14px; }
  .repairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .repairs .field { margin-bottom: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button {
    padding: 10px 16px;
    font-size: 0.95rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .metric { background: var(--ok-bg); border-radius: 10px; padding: 16px; text-align: center; }
  .metric .val { font-size: 1.6rem; font-weight: 700; }
  .metric .name { color: var(--muted); font-size: 0.9rem; }
  .formula { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; color: var(--muted); margin-top: 12px; }
  .error { color: var(--error); font-weight: 600; margin-top: 12px; min-height: 1.2em; }
  .summary { margin-top: 12px; font-size: 0.95rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .overflow { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ишенимдүүлүк калькулятору</h1>
  <p class="sub">MTBF, MTTR жана жеткиликтүүлүк коэффициентин эсептөө</p>

  <div class="card">
    <div class="field">
      <label for="totalTime">Байкоо мезгили (саат)</label>
      <input type="number" id="totalTime" min="0" step="any" value="96">
    </div>
    <div class="field">
      <label for="failures">Бузулуулардын саны (N)</label>
      <input type="number" id="failures" min="1" step="1" value="5">
    </div>
    <div class="field">
      <label>Ар бир бузулуунун оңдоо убактысы (саат)</label>
      <div class="repairs" id="repairs"></div>
    </div>
    <div class="row">
      <button class="primary" id="calc">Эсептөө</button>
      <button id="reset">Баштапкы маанилер</button>
    </div>
    <div class="error" id="error" role="alert"></div>
  </div>

  <div class="card" id="resultCard" hidden>
    <div class="results">
      <div class="metric"><div class="val" id="mtbf">—</div><div class="name">MTBF, саат</div></div>
      <div class="metric"><div class="val" id="mttr">—</div><div class="name">MTTR, саат</div></div>
      <div class="metric"><div class="val" id="avail">—</div><div class="name">Жеткиликтүүлүк, %</div></div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="formula" id="formula"></div>
  </div>

  <div class="card">
    <div class="overflow">
      <table>
        <thead><tr><th>Вариант</th><th>N</th><th>Токтоп туруу, саат</th><th>Иштөө, саат</th><th>MTBF</th><th>MTTR</th><th>A, %</th></tr></thead>
        <tbody id="variants"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const DEFAULTS = { total: 96, repairs: [3, 1, 4, 2, 5] };

  function calculateReliability(totalTime, repairTimes) {
    const failures = repairTimes.length;
    if (totalTime <= 0 || failures === 0) throw new Error("Маалыматтар туура эмес");
    if (repairTimes.some(t => t < 0)) throw new Error("Оңдоо убактысы терс болбошу керек");
    const downtime = repairTimes.reduce((a, b) => a + b, 0);
    if (downtime >= totalTime) throw new Error("Токтоп туруу мезгилден аз болушу керек");
    const uptime = totalTime - downtime;
    const mtbf = uptime / failures;
    const mttr = downtime / failures;
    const availability = uptime / totalTime * 100;
    return { mtbf, mttr, availability, uptime, downtime, failures };
  }

  const fmt = (x, d = 2) => Number(x).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: d });

  const elRepairs = document.getElementById("repairs");
  const elFailures = document.getElementById("failures");
  const elTotal = document.getElementById("totalTime");
  const elError = document.getElementById("error");

  function renderRepairInputs(values) {
    const n = Math.max(1, Math.floor(Number(elFailures.value) || 1));
    const current = [...elRepairs.querySelectorAll("input")].map(i => i.value);
    elRepairs.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const lbl = document.createElement("label");
      lbl.textContent = (i + 1) + "-бузулуу";
      lbl.htmlFor = "r" + i;
      const inp = document.createElement("input");
      inp.type = "number";
      inp.id = "r" + i;
      inp.min = "0";
      inp.step = "any";
      inp.value = values ? (values[i] ?? "") : (current[i] ?? "");
      wrap.append(lbl, inp);
      elRepairs.append(wrap);
    }
  }

  function readInputs() {
    const total = parseFloat(elTotal.value);
    const repairs = [...elRepairs.querySelectorAll("input")].map(i => parseFloat(i.value));
    if (Number.isNaN(total)) throw new Error("Байкоо мезгилин киргизиңиз");
    if (repairs.some(Number.isNaN)) throw new Error("Бардык оңдоо убактысын киргизиңиз");
    return { total, repairs };
  }

  function showVariants(total) {
    const rows = [
      [4, 8], [3, 6], [5, 10], [2, 4], [6, 12]
    ];
    const tbody = document.getElementById("variants");
    tbody.innerHTML = "";
    rows.forEach(([n, down], idx) => {
      const r = calculateReliability(total, Array(n).fill(down / n));
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${idx + 1}</td><td>${n}</td><td>${down}</td><td>${fmt(r.uptime)}</td><td>${fmt(r.mtbf)}</td><td>${fmt(r.mttr)}</td><td>${fmt(r.availability)}</td>`;
      tbody.append(tr);
    });
  }

  function run() {
    elError.textContent = "";
    try {
      const { total, repairs } = readInputs();
      const r = calculateReliability(total, repairs);
      document.getElementById("mtbf").textContent = fmt(r.mtbf);
      document.getElementById("mttr").textContent = fmt(r.mttr);
      document.getElementById("avail").textContent = fmt(r.availability, 3);
      document.getElementById("summary").textContent =
        `Токтоп туруу: ${fmt(r.downtime)} саат, иштөө: ${fmt(r.uptime)} саат, бузулуу саны: ${r.failures}.`;
      document.getElementById("formula").textContent =
        `A = MTBF / (MTBF + MTTR) × 100% = ${fmt(r.mtbf, 3)} / (${fmt(r.mtbf, 3)} + ${fmt(r.mttr, 3)}) × 100%`;
      document.getElementById("resultCard").hidden = false;
    } catch (e) {
      elError.textContent = e.message;
      document.getElementById("resultCard").hidden = true;
    }
  }

  elFailures.addEventListener("change", () => renderRepairInputs());
  document.getElementById("calc").addEventListener("click", run);
  document.getElementById("reset").addEventListener("click", () => {
    elTotal.value = DEFAULTS.total;
    elFailures.value = DEFAULTS.repairs.length;
    renderRepairInputs(DEFAULTS.repairs);
    run();
  });

  renderRepairInputs(DEFAULTS.repairs);
  showVariants(DEFAULTS.total);
  run();
</script>
</body>
</html>
